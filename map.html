<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hierarchical District → Ward → Sub-Part Mapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0f1724;
      color: #e6eef8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    h1 { margin: 8px 0; font-size: 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0; }
    button, select, label.btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #60a5fa;
      color: #042033;
      font-weight: bold;
      font-size: 13px;
    }
    button.sec { background: #334155; color: #e2e8f0; }
    button.ok { background: #4ade80; color: #052e16; }
    button.del { background: #f87171; color: #450a0a; }
    input[type="text"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
    }
    #map {
      height: 500px;
      width: 100%;
      max-width: 950px;
      border-radius: 10px;
      margin-top: 10px;
      cursor: crosshair;
    }
    .panel {
      margin-top: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      max-width: 950px;
      width: 100%;
    }
    ul { list-style: none; padding: 0; margin: 8px 0; max-height: 140px; overflow-y: auto; }
    li { background: rgba(255,255,255,0.06); margin: 4px 0; padding: 6px; border-radius: 6px; font-size: 13px; }
    pre {
      background: #060b14;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #38bdf8;
      max-height: 200px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>District → Ward → Sub-Part Boundary Mapper</h1>

  <!-- Step 1: Semi-Transparent Reference Map Overlay -->
  <div class="bar">
    <label class="btn">
      📁 1. Upload Reference Map Image
      <input type="file" id="imageLoader" accept="image/*" style="display:none" />
    </label>
    <span style="align-self:center; font-size:13px;">Opacity:</span>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.55" />
    <button class="sec" onclick="togglePins()">Toggle Corner Pins</button>
  </div>

  <!-- Step 2, 3, 4: Hierarchy Drawing Controls -->
  <div class="bar">
    <select id="drawLevel" onchange="onLevelChange()">
      <option value="district">Step 2: Draw District Border</option>
      <option value="ward">Step 3: Draw Ward (Auto-Snap Borders)</option>
      <option value="subpart">Step 4: Sub-Divide Ward Part</option>
    </select>
    <select id="parentWardSelect" style="display:none;"></select>
    <input type="text" id="areaName" value="Betul District" placeholder="Enter Name / Ward #" />
    <button class="sec" onclick="undoCorner()">↩ Undo Corner</button>
    <button class="ok" onclick="savePolygon()">✅ Save Boundary</button>
    <button onclick="exportJSON()">⬇ Export JSON</button>
    <button class="del" onclick="resetAll()">♻ Reset All</button>
  </div>

  <p id="status" style="margin:4px 0; font-size:13px; color:#93c5fd;">
    Click on the map to add corners (supports 20–50+ corners per ward). Nearby corners snap automatically.
  </p>

  <div id="map"></div>

  <div class="panel">
    <b>Current Active Corners (<span id="cornerCount">0</span>):</b>
    <ul id="cornerList"></ul>
  </div>

  <div class="panel">
    <b>Saved District, Wards & Sub-Parts (Exact Areas):</b>
    <div id="hierarchyList" style="margin-top:8px;">No boundaries saved yet.</div>
    <pre id="jsonOutput">{}</pre>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script>
    // Centered on Betul, MP
    let map = L.map('map').setView([21.9035, 77.9015], 13);

    // Uses standard OpenStreetMap on GitHub Pages (http/https), and falls back cleanly if opened via file://
    const isLocalFile = window.location.protocol === 'file:';
    const tileUrl = isLocalFile
      ? 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png'
      : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

    L.tileLayer(tileUrl, {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let dataStore = { district: null, wards: [] };
    let currentCorners = [];
    let tempMarkers = [];
    let tempPolyline = null;
    let savedLayerGroup = L.layerGroup().addTo(map);

    // Overlay image state
    let imageOverlay = null, nwPin = null, sePin = null, pinsVisible = true;

    function onLevelChange() {
      const level = document.getElementById('drawLevel').value;
      const parentSel = document.getElementById('parentWardSelect');
      const nameInput = document.getElementById('areaName');
      parentSel.style.display = 'none';

      if (level === 'district') {
        nameInput.value = dataStore.district ? dataStore.district.name : "Betul District";
      } else if (level === 'ward') {
        const nextNum = String(dataStore.wards.length + 1).padStart(2, '0');
        nameInput.value = `Ward ${nextNum}`;
      } else if (level === 'subpart') {
        if (dataStore.wards.length === 0) {
          alert("Draw and save at least 1 Ward first.");
          document.getElementById('drawLevel').value = 'ward';
          return;
        }
        parentSel.style.display = 'inline-block';
        parentSel.innerHTML = dataStore.wards.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
        nameInput.value = "Sub-Part 1";
      }
      currentCorners = [];
      redrawActiveCorners();
    }

    // Magnetic vertex snapping so shared ward borders connect without gaps
    function getSnapPoint(latlng) {
      const allPts = [];
      if (dataStore.district) dataStore.district.corners.forEach(c => allPts.push([c.lat, c.lng]));
      dataStore.wards.forEach(w => {
        w.corners.forEach(c => allPts.push([c.lat, c.lng]));
        w.subParts.forEach(sp => sp.corners.forEach(c => allPts.push([c.lat, c.lng])));
      });

      const clickPx = map.latLngToContainerPoint(latlng);
      let best = null, minPx = 15;
      allPts.forEach(p => {
        const d = clickPx.distanceTo(map.latLngToContainerPoint(p));
        if (d < minPx) { minPx = d; best = p; }
      });
      return best;
    }

    map.on('click', (e) => {
      const snapped = getSnapPoint(e.latlng);
      const pt = snapped
        ? [snapped[0], snapped[1]]
        : [Number(e.latlng.lat.toFixed(6)), Number(e.latlng.lng.toFixed(6))];

      currentCorners.push(pt);
      redrawActiveCorners();
    });

    function redrawActiveCorners() {
      tempMarkers.forEach(m => map.removeLayer(m));
      tempMarkers = [];
      if (tempPolyline) { map.removeLayer(tempPolyline); tempPolyline = null; }

      document.getElementById('cornerCount').textContent = currentCorners.length;
      const list = document.getElementById('cornerList');
      list.innerHTML = "";

      currentCorners.forEach((c, i) => {
        const m = L.circleMarker(c, { radius: 5, color: "red", fillColor: "yellow", fillOpacity: 1 }).addTo(map);
        tempMarkers.push(m);

        const li = document.createElement('li');
        li.textContent = `Corner ${i + 1}: (${c[0].toFixed(6)}, ${c[1].toFixed(6)})`;
        list.appendChild(li);
      });

      if (currentCorners.length > 1) {
        tempPolyline = L.polyline([...currentCorners, currentCorners[0]], { color: 'yellow', dashArray: '5,5' }).addTo(map);
      }
    }

    function undoCorner() {
      currentCorners.pop();
      redrawActiveCorners();
    }

    function computeMetrics(name, corners, extra = {}) {
      const ring = [...corners.map(c => [c[1], c[0]]), [corners[0][1], corners[0][0]]];
      const poly = turf.polygon([ring]);
      const areaSqMeters = turf.area(poly);
      const center = turf.centroid(poly).geometry.coordinates;
      return {
        ...extra,
        name,
        center: { lat: Number(center[1].toFixed(6)), lng: Number(center[0].toFixed(6)) },
        corners: corners.map((c, i) => ({ corner: i + 1, lat: c[0], lng: c[1] })),
        areaSqMeters: Number(areaSqMeters.toFixed(2)),
        areaHectares: Number((areaSqMeters / 10000).toFixed(4)),
        areaAcres: Number((areaSqMeters / 4046.856).toFixed(4))
      };
    }

    function savePolygon() {
      if (currentCorners.length < 3) {
        alert("At least 3 corners needed.");
        return;
      }
      const level = document.getElementById('drawLevel').value;
      const name = document.getElementById('areaName').value.trim() || "Unnamed";

      if (level === 'district') {
        dataStore.district = computeMetrics(name, currentCorners);
        document.getElementById('drawLevel').value = 'ward';
        onLevelChange();
      } else if (level === 'ward') {
        const ward = computeMetrics(name, currentCorners, { id: 'w_' + Date.now(), subParts: [] });
        dataStore.wards.push(ward);
        const nextNum = String(dataStore.wards.length + 1).padStart(2, '0');
        document.getElementById('areaName').value = `Ward ${nextNum}`;
      } else if (level === 'subpart') {
        const parentId = document.getElementById('parentWardSelect').value;
        const parent = dataStore.wards.find(w => w.id === parentId);
        if (parent) {
          parent.subParts.push(computeMetrics(name, currentCorners, { id: 'sp_' + Date.now() }));
          document.getElementById('areaName').value = `Sub-Part ${parent.subParts.length + 1}`;
        }
      }

      currentCorners = [];
      redrawActiveCorners();
      renderAll();
    }

    function renderAll() {
      savedLayerGroup.clearLayers();
      let html = "";

      if (dataStore.district) {
        const d = dataStore.district;
        L.polygon(d.corners.map(c => [c.lat, c.lng]), { color: 'orange', weight: 3, fillOpacity: 0.1 })
          .bindPopup(`<b>District: ${d.name}</b><br>${d.areaHectares} ha`)
          .addTo(savedLayerGroup);

        html += `<div><b>🏛️ District: ${d.name}</b> — ${d.areaSqMeters.toLocaleString()} m² | ${d.areaHectares} ha | ${d.areaAcres} acres<hr style="opacity:0.2"></div>`;
      }

      dataStore.wards.forEach((w, idx) => {
        const color = `hsl(${(idx * 47) % 360}, 75%, 50%)`;
        L.polygon(w.corners.map(c => [c.lat, c.lng]), { color, fillOpacity: 0.3 })
          .bindPopup(`<b>${w.name}</b><br>Corners: ${w.corners.length}<br>${w.areaSqMeters.toLocaleString()} m²`)
          .addTo(savedLayerGroup);

        html += `<div><b>📍 ${w.name}</b> (${w.corners.length} corners) — ${w.areaSqMeters.toLocaleString()} m² | ${w.areaHectares} ha | ${w.areaAcres} acres`;

        w.subParts.forEach(sp => {
          L.polygon(sp.corners.map(c => [c.lat, c.lng]), { color: 'lime', dashArray: '4,4', fillOpacity: 0.35 })
            .bindPopup(`<b>${w.name} → ${sp.name}</b><br>${sp.areaSqMeters.toLocaleString()} m²`)
            .addTo(savedLayerGroup);
          html += `<div style="margin-left:16px; font-size:12px; color:#93c5fd;">↳ ${sp.name}: ${sp.areaSqMeters.toLocaleString()} m² (${sp.areaAcres} acres)</div>`;
        });

        html += `<hr style="opacity:0.2"></div>`;
      });

      document.getElementById('hierarchyList').innerHTML = html || "No boundaries saved yet.";
      document.getElementById('jsonOutput').textContent = JSON.stringify(dataStore, null, 2);
    }

    // Reference Map Image Overlay
    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const b = [[21.928, 77.870], [21.876, 77.936]];
        if (imageOverlay) map.removeLayer(imageOverlay);
        if (nwPin) map.removeLayer(nwPin);
        if (sePin) map.removeLayer(sePin);

        imageOverlay = L.imageOverlay(ev.target.result, b, {
          opacity: parseFloat(document.getElementById('opacitySlider').value)
        }).addTo(map);
        nwPin = L.marker(b[0], { draggable: true }).addTo(map).bindTooltip("Top-Left Corner");
        sePin = L.marker(b[1], { draggable: true }).addTo(map).bindTooltip("Bottom-Right Corner");

        const sync = () => imageOverlay.setBounds([nwPin.getLatLng(), sePin.getLatLng()]);
        nwPin.on('drag', sync);
        sePin.on('drag', sync);
        map.fitBounds(b);
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('opacitySlider').addEventListener('input', (e) => {
      if (imageOverlay) imageOverlay.setOpacity(parseFloat(e.target.value));
    });

    function togglePins() {
      if (!nwPin || !sePin) return;
      pinsVisible = !pinsVisible;
      nwPin.setOpacity(pinsVisible ? 1 : 0);
      sePin.setOpacity(pinsVisible ? 1 : 0);
    }

    function exportJSON() {
      const a = document.createElement('a');
      a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataStore, null, 2));
      a.download = "district_wards_subparts.json";
      a.click();
    }

    function resetAll() {
      dataStore = { district: null, wards: [] };
      currentCorners = [];
      redrawActiveCorners();
      renderAll();
    }
  </script>
</body>
</html>
