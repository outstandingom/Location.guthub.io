<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clean State & District Border Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0f1724;
      color: #e6eef8;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      background: #162033;
      border-bottom: 1px solid #293854;
      align-items: center;
    }
    input[type="text"] {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f1724;
      color: #fff;
      font-size: 13px;
      width: 240px;
    }
    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #60a5fa;
      color: #042033;
      font-weight: bold;
      font-size: 13px;
    }
    button.sec { background: #334155; color: #e2e8f0; }
    button.ok { background: #4ade80; color: #052e16; }
    #status { font-size: 12px; color: #93c5fd; margin-left: auto; }

    /* Plain clean canvas — no roads, labels, or clutter */
    #map {
      flex: 1;
      width: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="bar">
    <input type="text" id="placeInput" value="Betul district, Madhya Pradesh, India" placeholder="Enter District or State name..." />
    <button onclick="loadBorder()">Show Border</button>
    <button class="sec" onclick="quickLoad('Betul district, Madhya Pradesh, India')">Betul District</button>
    <button class="sec" onclick="quickLoad('Madhya Pradesh, India')">Madhya Pradesh State</button>
    <button class="sec" id="bgBtn" onclick="toggleBackground()">Background: Clean White</button>
    <button class="ok" onclick="exportGeoJSON()">⬇ Export Border JSON</button>
    <span id="status">Loading...</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Plain Leaflet map (No tiles loaded by default -> 100% clean border only)
    const map = L.map('map', { zoomControl: true }).setView([21.88, 77.90], 10);

    let borderLayer = null;
    let currentGeoJSON = null;
    let osmTiles = null;
    let bgMode = 'white'; // 'white' | 'dark' | 'osm'

    function quickLoad(query) {
      document.getElementById('placeInput').value = query;
      loadBorder();
    }

    async function loadBorder() {
      const query = document.getElementById('placeInput').value.trim();
      if (!query) return;
      const status = document.getElementById('status');
      status.textContent = `Fetching "${query}"...`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&polygon_geojson=1&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.length || !data[0].geojson || (data[0].geojson.type !== 'Polygon' && data[0].geojson.type !== 'MultiPolygon')) {
          status.textContent = "Border polygon not found. Try adding 'district' or 'state'.";
          return;
        }

        currentGeoJSON = {
          type: "Feature",
          properties: { name: data[0].display_name },
          geometry: data[0].geojson
        };

        if (borderLayer) map.removeLayer(borderLayer);

        borderLayer = L.geoJSON(currentGeoJSON, {
          style: {
            color: bgMode === 'dark' ? '#38bdf8' : '#111827',
            weight: 2.5,
            fillColor: '#60a5fa',
            fillOpacity: 0.08
          }
        }).addTo(map);

        map.fitBounds(borderLayer.getBounds(), { padding: [30, 30] });
        status.textContent = `Showing: ${data[0].display_name.split(',')[0]}`;
      } catch (err) {
        status.textContent = "Error loading border: " + err.message;
      }
    }

    function toggleBackground() {
      const mapEl = document.getElementById('map');
      const btn = document.getElementById('bgBtn');

      if (bgMode === 'white') {
        bgMode = 'dark';
        mapEl.style.background = '#0f1724';
        btn.textContent = 'Background: Clean Dark';
        if (borderLayer) borderLayer.setStyle({ color: '#38bdf8' });
      } else if (bgMode === 'dark') {
        bgMode = 'osm';
        osmTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        btn.textContent = 'Background: OSM Map';
        if (borderLayer) borderLayer.setStyle({ color: '#dc2626' });
      } else {
        bgMode = 'white';
        if (osmTiles) { map.removeLayer(osmTiles); osmTiles = null; }
        mapEl.style.background = '#ffffff';
        btn.textContent = 'Background: Clean White';
        if (borderLayer) borderLayer.setStyle({ color: '#111827' });
      }
    }

    function exportGeoJSON() {
      if (!currentGeoJSON) { alert("Load a border first."); return; }
      const a = document.createElement('a');
      a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentGeoJSON, null, 2));
      a.download = "border_geojson.json";
      a.click();
    }

    // Auto-load Betul District border on open
    loadBorder();
  </script>
</body>
</html>
